x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  flask:
    build: .
    container_name: 'flask_app'
    ports:
      - '5000:5000'
    environment:
      LOG_LEVEL: INFO
      FLASK_DEBUG: 'false'
      SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en el archivo .env}
      APP_USERNAME: ${APP_USERNAME:?Falta APP_USERNAME en el archivo .env}
      APP_PASSWORD: ${APP_PASSWORD:?Falta APP_PASSWORD en el archivo .env}
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - '9090:9090'
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
    logging: *default-logging
